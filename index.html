<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Test Présences Chorale</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    text-align: center;
}

header {
    background: #222;
    color: white;
    padding: 20px;
}

h1 {
    margin: 0;
    font-size: 22px;
}

#scanner {
    width: 100%;
    max-width: 500px;
    margin: 20px auto;
    background: white;
}

#result {
    margin: 20px;
    padding: 20px;
    border-radius: 12px;
    background: white;
    font-size: 18px;
    word-break: break-word;
}

.success {
    background: #d9f7df !important;
}

.error {
    background: #ffdede !important;
}

#debug {
    margin: 20px;
    padding: 15px;
    background: #222;
    color: #00ff66;
    text-align: left;
    font-family: monospace;
    font-size: 14px;
    border-radius: 8px;
    white-space: pre-wrap;
}

</style>
</head>


<body>

<header>
    <h1>🎵 Test Présences Chorale</h1>
</header>

<div id="scanner"></div>

<div id="result">
    Scannez un QR code
</div>

<div id="debug">
Initialisation...
</div>


<script>

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbztFWFsDYbWyVng9hSDd6vvtMnU_i9kLvXgweqGoTR-LXg3prTVcWehyo_CcaUpNnEmlg/exec";


let scanner;
let dernierScan = null;
let scanEnCours = false;


function debug(message) {

    const zone = document.getElementById("debug");

    zone.innerHTML += "\n" + message;

    console.log(message);
}


debug("✅ Page chargée");
debug("📡 Serveur : Apps Script");
debug("⏳ Scanner en cours d'initialisation...");


/* =========================
   CALLBACK GOOGLE
========================= */

window.presenceCallback = function(data) {

    debug("✅ CALLBACK GOOGLE REÇU");

    debug(JSON.stringify(data));

    afficherResultat(data);

};


/* =========================
   AFFICHAGE
========================= */

function afficherResultat(data) {

    const result = document.getElementById("result");

    if (data.success) {

        result.className = "success";

        let message = data.duplicate
            ? "⚠️ Présence déjà enregistrée"
            : "✅ Présence enregistrée";

        result.innerHTML =
            "<strong>" +
            data.prenom +
            " " +
            data.nom +
            "</strong><br><br>" +
            (data.voix || "") +
            "<br><br>" +
            message;

    } else {

        result.className = "error";

        result.innerHTML =
            "❌ " + data.message;

    }

    scanEnCours = false;
}


/* =========================
   TRAITEMENT QR
========================= */

function traiterQR(qrCodeMessage) {

    if (scanEnCours) {

        debug("⚠️ Scan déjà en cours");

        return;
    }

    if (dernierScan === qrCodeMessage) {

        return;
    }

    scanEnCours = true;
    dernierScan = qrCodeMessage;


    debug("📷 QR DÉTECTÉ");
    debug("ID = " + qrCodeMessage);


    const url =
        APPS_SCRIPT_URL +
        "?id=" +
        encodeURIComponent(qrCodeMessage) +
        "&callback=presenceCallback" +
        "&_=" +
        Date.now();


    debug("🌐 Appel du serveur...");
    debug(url);


    const script = document.createElement("script");

    script.src = url;


    script.onload = function() {

        debug("📥 Réponse serveur chargée");

    };


    script.onerror = function() {

        debug("❌ ERREUR SCRIPT");
        debug("Le navigateur n'a pas pu charger la réponse.");

        document.getElementById("result").className = "error";

        document.getElementById("result").innerHTML =
            "❌ Erreur de communication";

        scanEnCours = false;

    };


    document.body.appendChild(script);


    setTimeout(function() {

        dernierScan = null;

    }, 3000);

}


/* =========================
   SCANNER
========================= */

try {

    scanner = new Html5QrcodeScanner(
        "scanner",
        {
            fps: 10,
            qrbox: {
                width: 250,
                height: 250
            }
        },
        false
    );

    scanner.render(
        traiterQR,
        function(errorMessage) {
            // erreurs normales ignorées
        }
    );

    debug("✅ Scanner initialisé");

}
catch (error) {

    debug("❌ ERREUR SCANNER");
    debug(error.toString());

}

</script>

</body>

</html>
