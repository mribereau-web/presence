<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Présences Chorale</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    text-align: center;
}

header {
    background: #222;
    color: white;
    padding: 20px;
}

h1 {
    margin: 0;
    font-size: 24px;
}

#scanner {
    width: 100%;
    max-width: 500px;
    margin: 20px auto;
    background: white;
}

#result {
    margin: 20px auto;
    max-width: 500px;
    padding: 20px;
    border-radius: 12px;
    background: white;
    font-size: 20px;
}

.success {
    background: #d9f7df !important;
}

.error {
    background: #ffdede !important;
}

.name {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 10px;
}

.voice {
    font-size: 20px;
}
</style>
</head>

<body>

<header>
    <h1>🎵 Présences Chorale</h1>
</header>

<div id="scanner"></div>

<div id="result">
    Scannez un QR code
</div>


<script>

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbztFWFsDYbWyVng9hSDd6vvtMnU_i9kLvXgweqGoTR-LXg3prTVcWehyo_CcaUpNnEmlg/exec";

let dernierScan = null;
let scanEnCours = false;


/* =========================
   ENVOI DU QR À GOOGLE
========================= */

function traiterQR(qrCodeMessage) {

    if (scanEnCours) return;

    if (dernierScan === qrCodeMessage) return;

    scanEnCours = true;
    dernierScan = qrCodeMessage;


    const result = document.getElementById("result");

    result.className = "";
    result.innerHTML =
        "📡 Enregistrement de la présence...";


    /*
       Création d'un formulaire invisible
    */

    const form = document.createElement("form");

    form.method = "GET";

    form.action = APPS_SCRIPT_URL;

    form.target = "googleResponse";

    form.style.display = "none";


    const input = document.createElement("input");

    input.type = "hidden";

    input.name = "id";

    input.value = qrCodeMessage;


    form.appendChild(input);

    document.body.appendChild(form);


    /*
       Iframe invisible qui reçoit
       la réponse Google
    */

    let iframe = document.getElementById("googleResponse");

    if (!iframe) {

        iframe = document.createElement("iframe");

        iframe.id = "googleResponse";

        iframe.name = "googleResponse";

        iframe.style.display = "none";

        document.body.appendChild(iframe);

    }


    form.submit();


    /*
       On considère l'enregistrement
       effectué après un court délai.
    */

    setTimeout(function() {

        result.className = "success";

        result.innerHTML =
            "✅ Présence envoyée<br><br>" +
            "ID : " +
            qrCodeMessage;


        scanEnCours = false;

    }, 1500);


    setTimeout(function() {

        dernierScan = null;

        result.className = "";

        result.innerHTML =
            "Scannez un QR code";

    }, 3500);

}


/* =========================
   SCANNER
========================= */

const scanner = new Html5QrcodeScanner(
    "scanner",
    {
        fps: 10,
        qrbox: {
            width: 250,
            height: 250
        }
    },
    false
);


scanner.render(
    traiterQR,
    function(errorMessage) {
        // Les erreurs normales de détection sont ignorées
    }
);

</script>

</body>
</html>
