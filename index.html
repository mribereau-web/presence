<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Présences Chorale</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    text-align: center;
}

header {
    background: #222;
    color: white;
    padding: 20px;
}

h1 {
    margin: 0;
    font-size: 24px;
}

#startButton {
    display: block;
    margin: 25px auto;
    padding: 16px 28px;
    font-size: 20px;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    background: #222;
    color: white;
}

#scanner {
    width: 100%;
    max-width: 500px;
    margin: 20px auto;
    background: white;
}

#result {
    margin: 20px auto;
    max-width: 500px;
    padding: 20px;
    border-radius: 12px;
    background: white;
    font-size: 20px;
}

.success {
    background: #d9f7df !important;
}

.error {
    background: #ffdede !important;
}

</style>

</head>

<body>

<header>
    <h1>🎵 Présences Chorale</h1>
</header>

<button id="startButton">
    📷 Démarrer la caméra
</button>

<div id="scanner"></div>

<div id="result">
    Appuyez sur « Démarrer la caméra »
</div>


<script>

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbztFWFsDYbWyVng9hSDd6vvtMnU_i9kLvXgweqGoTR-LXg3prTVcWehyo_CcaUpNnEmlg/exec";


let scanner = null;
let dernierScan = null;
let scanEnCours = false;


/* =========================
   DÉMARRAGE CAMÉRA
========================= */

document.getElementById("startButton").addEventListener("click", function() {

    const button = this;

    button.disabled = true;
    button.innerText = "📷 Démarrage...";

    document.getElementById("result").innerHTML =
        "Autorisation de la caméra...";


    scanner = new Html5Qrcode("scanner");


    scanner.start(
        { facingMode: "environment" },

        {
            fps: 10,
            qrbox: {
                width: 250,
                height: 250
            }
        },

        traiterQR,

        function(errorMessage) {
            // Les erreurs normales de détection sont ignorées
        }

    ).then(function() {

        button.style.display = "none";

        document.getElementById("result").innerHTML =
            "📷 Caméra active — présentez un QR code";

    }).catch(function(error) {

        console.error(error);

        button.disabled = false;

        button.innerText = "📷 Réessayer";

        document.getElementById("result").className = "error";

        document.getElementById("result").innerHTML =
            "❌ Impossible d'ouvrir la caméra.<br><br>" +
            "Vérifiez que Safari a l'autorisation d'utiliser l'appareil photo.";

    });

});


/* =========================
   QR CODE
========================= */

function traiterQR(qrCodeMessage) {

    if (scanEnCours) return;

    if (dernierScan === qrCodeMessage) return;

    scanEnCours = true;
    dernierScan = qrCodeMessage;


    document.getElementById("result").className = "";

    document.getElementById("result").innerHTML =
        "📡 Enregistrement de la présence...";


    /* =========================
       ENVOI À GOOGLE
    ========================= */

    const form = document.createElement("form");

    form.method = "GET";

    form.action = APPS_SCRIPT_URL;

    form.target = "googleResponse";

    form.style.display = "none";


    const input = document.createElement("input");

    input.type = "hidden";

    input.name = "id";

    input.value = qrCodeMessage;


    form.appendChild(input);

    document.body.appendChild(form);


    /* iframe invisible */

    let iframe =
        document.getElementById("googleResponse");


    if (!iframe) {

        iframe = document.createElement("iframe");

        iframe.id = "googleResponse";

        iframe.name = "googleResponse";

        iframe.style.display = "none";

        document.body.appendChild(iframe);

    }


    form.submit();


    /* =========================
       CONFIRMATION
    ========================= */

    setTimeout(function() {

        document.getElementById("result").className =
            "success";

        document.getElementById("result").innerHTML =
            "✅ Présence envoyée<br><br>" +
            "ID : " +
            qrCodeMessage;

        scanEnCours = false;

    }, 1500);


    setTimeout(function() {

        dernierScan = null;

        document.getElementById("result").className = "";

        document.getElementById("result").innerHTML =
            "📷 Présentez un QR code";

    }, 3500);

}

</script>

</body>
</html>
