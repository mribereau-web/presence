<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Présences Chorale</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    text-align: center;
}

header {
    background: #222;
    color: white;
    padding: 20px;
}

h1 {
    margin: 0;
    font-size: 24px;
}

#scanner {
    width: 100%;
    max-width: 500px;
    margin: 20px auto;
    background: white;
}

#result {
    margin: 20px auto;
    max-width: 500px;
    padding: 20px;
    border-radius: 12px;
    background: white;
    font-size: 20px;
}

.success {
    background: #d9f7df !important;
}

.error {
    background: #ffdede !important;
}

.name {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 10px;
}

.voice {
    font-size: 20px;
}
</style>
</head>

<body>

<header>
    <h1>🎵 Présences Chorale</h1>
</header>

<div id="scanner"></div>

<div id="result">
    Scannez un QR code
</div>

<script>

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbztFWFsDYbWyVng9hSDd6vvtMnU_i9kLvXgweqGoTR-LXg3prTVcWehyo_CcaUpNnEmlg/exec";

let scanner;
let dernierScan = null;
let scanEnCours = false;


/* =========================
   CALLBACK GOOGLE
========================= */

window.presenceCallback = function(data) {

    console.log("Réponse Google :", data);

    afficherResultat(data);

    const script = document.getElementById("google-script");

    if (script) {
        script.remove();
    }
};


/* =========================
   AFFICHAGE
========================= */

function afficherResultat(data) {

    const result = document.getElementById("result");

    if (data.success) {

        result.className = "success";

        let message = data.duplicate
            ? "⚠️ Présence déjà enregistrée"
            : "✅ Présence enregistrée";

        result.innerHTML = `
            <div class="name">
                ${data.prenom} ${data.nom}
            </div>

            <div class="voice">
                ${data.voix || ""}
            </div>

            <br>

            <div>${message}</div>
        `;

    } else {

        result.className = "error";

        result.innerHTML = "❌ " + data.message;
    }

    setTimeout(() => {

        result.className = "";
        result.innerHTML = "Scannez un QR code";

        scanEnCours = false;

    }, 2000);
}


/* =========================
   TRAITEMENT DU QR CODE
========================= */

function traiterQR(qrCodeMessage) {

    if (scanEnCours) return;

    if (dernierScan === qrCodeMessage) return;

    scanEnCours = true;

    dernierScan = qrCodeMessage;

    console.log("QR détecté :", qrCodeMessage);


    /* Suppression d'un ancien script éventuel */

    const ancienScript = document.getElementById("google-script");

    if (ancienScript) {
        ancienScript.remove();
    }


    /* Création de l'appel Google */

    const script = document.createElement("script");

    script.id = "google-script";

    script.src =
        APPS_SCRIPT_URL +
        "?id=" +
        encodeURIComponent(qrCodeMessage) +
        "&callback=presenceCallback&_=" +
        Date.now();


    script.onerror = function() {

        console.error("Erreur lors de l'appel Google");

        document.getElementById("result").className = "error";

        document.getElementById("result").innerHTML =
            "❌ Impossible de contacter le serveur";

        scanEnCours = false;
    };


    document.body.appendChild(script);


    setTimeout(() => {

        dernierScan = null;

    }, 3000);
}


/* =========================
   SCANNER
========================= */

scanner = new Html5QrcodeScanner(
    "scanner",
    {
        fps: 10,
        qrbox: {
            width: 250,
            height: 250
        }
    },
    false
);

scanner.render(
    traiterQR,
    function(errorMessage) {
        // Les erreurs normales de détection sont ignorées
    }
);

</script>

</body>
</html>
